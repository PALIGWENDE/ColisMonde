name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: colismonde
          POSTGRES_PASSWORD: colismonde
          POSTGRES_DB: colismonde_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U colismonde"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://colismonde:colismonde@localhost:5432/colismonde_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:shared
      - run: npm run db:generate --workspace backend
      - run: npm run build:backend
      - run: npm run test:backend

  web:
    name: Site web (build)
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: https://colismonde-api-lj3o.onrender.com
      NEXT_PUBLIC_SOCKET_URL: https://colismonde-api-lj3o.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:web

  mobile:
    name: App mobile (typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - run: npm ci
      - run: npm run build:shared
      - run: npm ci
        working-directory: mobile
      - run: npx tsc --noEmit
        working-directory: mobile
