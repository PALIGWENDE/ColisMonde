# Blueprint Render — crée la base Postgres et l'API en un clic (Dashboard > New > Blueprint).
# Le site web (Next.js) n'est PAS ici : il se déploie séparément sur Vercel (voir DEPLOIEMENT.md).
services:
  - type: web
    name: colismonde-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: colismonde-db
          property: connectionString
      - key: WEB_ORIGIN
        sync: false # à renseigner après le déploiement Vercel (ex: https://colismonde.vercel.app)
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL_DAYS
        value: "30"
      - key: COOKIE_SECURE
        value: "true"
      - key: UPLOAD_DIR
        value: uploads
      - key: MAX_UPLOAD_SIZE_MB
        value: "5"
      - key: BCRYPT_SALT_ROUNDS
        value: "12"

databases:
  - name: colismonde-db
    plan: free
    databaseName: colismonde
    user: colismonde
