# Blueprint Render — crée la base Postgres et l'API en un clic (Dashboard > New > Blueprint).
# Le site web (Next.js) n'est PAS ici : il se déploie séparément sur Vercel (voir DEPLOIEMENT.md).
services:
  - type: web
    name: colismonde-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: colismonde-db
          property: connectionString
      - key: WEB_ORIGIN
        sync: false # à renseigner après le déploiement Vercel (ex: https://colismonde.vercel.app)
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL_DAYS
        value: "30"
      - key: COOKIE_SECURE
        value: "true"
      - key: UPLOAD_DIR
        value: uploads
      - key: MAX_UPLOAD_SIZE_MB
        value: "5"
      - key: BCRYPT_SALT_ROUNDS
        value: "12"
      # Stockage objet (S3-compatible, ex. Cloudflare R2) et Redis (Socket.IO multi-instances +
      # limitation de débit partagée) — optionnels, laissés vides par défaut (voir DEPLOIEMENT.md
      # "Passer à l'échelle" pour l'activation). Sans eux, l'app tourne normalement en mono-instance
      # avec un disque local éphémère.
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_URL
        sync: false
      - key: REDIS_URL
        sync: false

databases:
  - name: colismonde-db
    plan: free
    databaseName: colismonde
    user: colismonde
